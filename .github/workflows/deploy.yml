name: deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"
  workflow_dispatch:

permissions:
  id-token: write   # required for OIDC
  contents: read

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - uses: aws-actions/setup-sam@v3
        with:
          use-installer: true

      # A concurrent update (e.g. a manual `sam deploy`) leaves the stack in an
      # IN_PROGRESS state, and CreateChangeSet hard-fails on it. Poll until the
      # stack settles (up to ~10 min) instead of erroring out.
      - name: Wait for stack to be stable
        run: |
          for i in $(seq 1 60); do
            STATUS=$(aws cloudformation describe-stacks \
              --stack-name fh-maintenance-bot \
              --query 'Stacks[0].StackStatus' --output text 2>/dev/null || echo "NO_STACK")
            case "$STATUS" in
              *IN_PROGRESS*) echo "Stack is $STATUS; waiting... ($i/60)"; sleep 10 ;;
              *) echo "Stack is $STATUS; proceeding."; exit 0 ;;
            esac
          done
          echo "Stack still busy after 10 minutes; giving up." >&2
          exit 1

      # RESOURCE_CALENDARS (~11 KB) is too large for a CloudFormation parameter
      # (4096 chars) or Lambda env vars (4 KB), so it ships as a file inside the
      # package and config.js reads it at runtime. Written BEFORE `sam build`
      # so it is in the build artifact; runtime-config/ must not be gitignored.
      - name: Write runtime config files
        env:
          RESOURCE_CALENDARS: ${{ vars.RESOURCE_CALENDARS }}
        run: |
          mkdir -p runtime-config
          [ -n "$RESOURCE_CALENDARS" ] && printf %s "$RESOURCE_CALENDARS" > runtime-config/resource-calendars.json
          echo "runtime-config written:"; ls -l runtime-config

      - name: SAM build
        run: sam build

      - name: SAM deploy
        env:
          GOOGLE_DRIVE_FOLDER_ID: ${{ vars.GOOGLE_DRIVE_FOLDER_ID }}
          ESCALATION_USER_ID: ${{ vars.ESCALATION_USER_ID }}
          ALARM_CHANNEL: ${{ vars.ALARM_CHANNEL }}
          LLM_MODEL_ID: ${{ vars.LLM_MODEL_ID }}
          CREA_TICKETS_ENABLED: ${{ vars.CREA_TICKETS_ENABLED }}
          CREA_TWA_USERNAME: ${{ secrets.CREA_TWA_USERNAME }}
          CREA_TWA_PASSWORD: ${{ secrets.CREA_TWA_PASSWORD }}
          CREA_TWA_PHONE: ${{ vars.CREA_TWA_PHONE }}
          CREA_TWA_ALLOW_ENTRY: ${{ vars.CREA_TWA_ALLOW_ENTRY }}
          CREA_TICKET_USER_IDS: ${{ vars.CREA_TICKET_USER_IDS }}
          RESERVATIONS_CHANNEL_ID: ${{ vars.RESERVATIONS_CHANNEL_ID }}
          ROOM_REQUESTS_SHEET_ID: ${{ vars.ROOM_REQUESTS_SHEET_ID }}
          KITCHEN_SHEET_ID: ${{ vars.KITCHEN_SHEET_ID }}
          RMS_BOOKING_ENABLED: ${{ vars.RMS_BOOKING_ENABLED }}
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          GOOGLE_WEB_CLIENT_SECRET: ${{ secrets.GOOGLE_WEB_CLIENT_SECRET }}
        run: |
          # Only pass optional overrides when set — SAM rejects an empty `Key=`
          # value rather than falling back to the template Default.
          OPTIONAL_PARAMS=()
          if [ -n "$GOOGLE_DRIVE_FOLDER_ID" ]; then
            OPTIONAL_PARAMS+=("GoogleDriveFolderId=$GOOGLE_DRIVE_FOLDER_ID")
          fi
          if [ -n "$ESCALATION_USER_ID" ]; then
            OPTIONAL_PARAMS+=("EscalationUserId=$ESCALATION_USER_ID")
          fi
          if [ -n "$ALARM_CHANNEL" ]; then
            OPTIONAL_PARAMS+=("AlarmChannel=$ALARM_CHANNEL")
          fi
          if [ -n "$LLM_MODEL_ID" ]; then
            OPTIONAL_PARAMS+=("LlmModelId=$LLM_MODEL_ID")
          fi
          if [ -n "$CREA_TICKETS_ENABLED" ]; then
            OPTIONAL_PARAMS+=("CreaTicketsEnabled=$CREA_TICKETS_ENABLED")
          fi
          if [ -n "$CREA_TWA_USERNAME" ]; then
            OPTIONAL_PARAMS+=("CreaTwaUsername=$CREA_TWA_USERNAME" "CreaTwaPassword=$CREA_TWA_PASSWORD" "CreaTwaPhone=$CREA_TWA_PHONE")
          fi
          if [ -n "$CREA_TICKET_USER_IDS" ]; then
            OPTIONAL_PARAMS+=("CreaTicketUserIds=$CREA_TICKET_USER_IDS")
          fi
          if [ -n "$CREA_TWA_ALLOW_ENTRY" ]; then
            OPTIONAL_PARAMS+=("CreaTwaAllowEntry=$CREA_TWA_ALLOW_ENTRY")
          fi
          if [ -n "$RESERVATIONS_CHANNEL_ID" ]; then
            OPTIONAL_PARAMS+=("ReservationsChannelId=$RESERVATIONS_CHANNEL_ID")
          fi
          if [ -n "$ROOM_REQUESTS_SHEET_ID" ]; then
            OPTIONAL_PARAMS+=("RoomRequestsSheetId=$ROOM_REQUESTS_SHEET_ID")
          fi
          if [ -n "$KITCHEN_SHEET_ID" ]; then
            OPTIONAL_PARAMS+=("KitchenSheetId=$KITCHEN_SHEET_ID")
          fi
          if [ -n "$RMS_BOOKING_ENABLED" ]; then
            OPTIONAL_PARAMS+=("RmsBookingEnabled=$RMS_BOOKING_ENABLED")
          fi
          if [ -n "$GOOGLE_WEB_CLIENT_ID" ]; then
            OPTIONAL_PARAMS+=("GoogleWebClientId=$GOOGLE_WEB_CLIENT_ID" "GoogleWebClientSecret=$GOOGLE_WEB_CLIENT_SECRET")
          fi
          sam deploy \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              SlackBotToken="${{ secrets.SLACK_BOT_TOKEN }}" \
              SlackSigningSecret="${{ secrets.SLACK_SIGNING_SECRET }}" \
              SlackChannelIds="${{ vars.SLACK_CHANNEL_IDS }}" \
              GoogleSheetId="${{ vars.GOOGLE_SHEET_ID }}" \
              GenderSheetId="${{ vars.GENDER_SHEET_ID }}" \
              GoogleClientId="${{ secrets.GOOGLE_CLIENT_ID }}" \
              GoogleClientSecret="${{ secrets.GOOGLE_CLIENT_SECRET }}" \
              GoogleRefreshToken="${{ secrets.GOOGLE_REFRESH_TOKEN }}" \
              "${OPTIONAL_PARAMS[@]}"
