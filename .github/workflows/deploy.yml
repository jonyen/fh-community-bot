name: deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"
  workflow_dispatch:

permissions:
  id-token: write   # required for OIDC
  contents: read

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - uses: aws-actions/setup-sam@v3
        with:
          use-installer: true

      - name: SAM build
        run: sam build

      - name: SAM deploy
        env:
          GOOGLE_DRIVE_FOLDER_ID: ${{ vars.GOOGLE_DRIVE_FOLDER_ID }}
          # The three JSON-valued reservation overrides contain spaces (room
          # names like "FH MPR"). SAM's --parameter-overrides Key=Value shorthand
          # splits values on spaces, which truncated them to "{" in the past, so
          # we base64-encode them here (no spaces) and config.js decodes them.
          RESERVATIONS_SHEET_ID: ${{ vars.RESERVATIONS_SHEET_ID }}
          RESERVATION_ROOMS: ${{ vars.RESERVATION_ROOMS }}
          RESOURCE_CALENDARS: ${{ vars.RESOURCE_CALENDARS }}
          VENUE_CALENDARS: ${{ vars.VENUE_CALENDARS }}
        run: |
          # Only pass optional overrides when set — SAM rejects an empty `Key=`
          # value rather than falling back to the template Default.
          b64() { printf %s "$1" | base64 | tr -d '\n'; }
          OPTIONAL_PARAMS=()
          if [ -n "$GOOGLE_DRIVE_FOLDER_ID" ]; then
            OPTIONAL_PARAMS+=("GoogleDriveFolderId=$GOOGLE_DRIVE_FOLDER_ID")
          fi
          if [ -n "$RESERVATIONS_SHEET_ID" ]; then
            OPTIONAL_PARAMS+=("ReservationsSheetId=$RESERVATIONS_SHEET_ID")
          fi
          # base64-encode the spaced JSON values so SAM passes them intact
          if [ -n "$RESERVATION_ROOMS" ]; then
            OPTIONAL_PARAMS+=("ReservationRooms=$(b64 "$RESERVATION_ROOMS")")
          fi
          if [ -n "$RESOURCE_CALENDARS" ]; then
            OPTIONAL_PARAMS+=("ResourceCalendars=$(b64 "$RESOURCE_CALENDARS")")
          fi
          if [ -n "$VENUE_CALENDARS" ]; then
            OPTIONAL_PARAMS+=("VenueCalendars=$(b64 "$VENUE_CALENDARS")")
          fi
          sam deploy \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              SlackBotToken="${{ secrets.SLACK_BOT_TOKEN }}" \
              SlackSigningSecret="${{ secrets.SLACK_SIGNING_SECRET }}" \
              SlackChannelIds="${{ vars.SLACK_CHANNEL_IDS }}" \
              GoogleSheetId="${{ vars.GOOGLE_SHEET_ID }}" \
              GenderSheetId="${{ vars.GENDER_SHEET_ID }}" \
              GoogleClientId="${{ secrets.GOOGLE_CLIENT_ID }}" \
              GoogleClientSecret="${{ secrets.GOOGLE_CLIENT_SECRET }}" \
              GoogleRefreshToken="${{ secrets.GOOGLE_REFRESH_TOKEN }}" \
              GroqApiKey="${{ secrets.GROQ_API_KEY }}" \
              "${OPTIONAL_PARAMS[@]}"
