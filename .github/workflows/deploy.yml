name: deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"
  workflow_dispatch:

permissions:
  id-token: write   # required for OIDC
  contents: read

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - uses: aws-actions/setup-sam@v3
        with:
          use-installer: true

      # The reservation room list and resource/venue calendar maps are too large
      # for CloudFormation parameters (4096 chars) and Lambda env vars (4 KB), so
      # we bundle them into the deployment package as files under runtime-config/
      # and config.js reads them at runtime. Written BEFORE `sam build` so they
      # are included in the build artifact.
      - name: Write runtime config files
        env:
          RESERVATION_ROOMS: ${{ vars.RESERVATION_ROOMS }}
          RESOURCE_CALENDARS: ${{ vars.RESOURCE_CALENDARS }}
          VENUE_CALENDARS: ${{ vars.VENUE_CALENDARS }}
        run: |
          mkdir -p runtime-config
          [ -n "$RESERVATION_ROOMS" ] && printf %s "$RESERVATION_ROOMS" > runtime-config/reservation-rooms.json
          [ -n "$RESOURCE_CALENDARS" ] && printf %s "$RESOURCE_CALENDARS" > runtime-config/resource-calendars.json
          [ -n "$VENUE_CALENDARS" ] && printf %s "$VENUE_CALENDARS" > runtime-config/venue-calendars.json
          echo "runtime-config written:"; ls -l runtime-config

      - name: SAM build
        run: sam build

      - name: SAM deploy
        env:
          GOOGLE_DRIVE_FOLDER_ID: ${{ vars.GOOGLE_DRIVE_FOLDER_ID }}
          # Only RESERVATIONS_SHEET_ID is small enough to remain a CFN parameter.
          RESERVATIONS_SHEET_ID: ${{ vars.RESERVATIONS_SHEET_ID }}
          RESERVATIONS_CHANNEL_ID: ${{ vars.RESERVATIONS_CHANNEL_ID }}
          ONESTOP_CHANNEL_ID: ${{ vars.ONESTOP_CHANNEL_ID }}
          ONESTOP_INFO_TABS: ${{ vars.ONESTOP_INFO_TABS }}
        run: |
          # Only pass optional overrides when set — SAM rejects an empty `Key=`
          # value rather than falling back to the template Default.
          OPTIONAL_PARAMS=()
          if [ -n "$GOOGLE_DRIVE_FOLDER_ID" ]; then
            OPTIONAL_PARAMS+=("GoogleDriveFolderId=$GOOGLE_DRIVE_FOLDER_ID")
          fi
          if [ -n "$RESERVATIONS_SHEET_ID" ]; then
            OPTIONAL_PARAMS+=("ReservationsSheetId=$RESERVATIONS_SHEET_ID")
          fi
          if [ -n "$RESERVATIONS_CHANNEL_ID" ]; then
            OPTIONAL_PARAMS+=("ReservationsChannelId=$RESERVATIONS_CHANNEL_ID")
          fi
          if [ -n "$ONESTOP_CHANNEL_ID" ]; then
            OPTIONAL_PARAMS+=("OneStopChannelId=$ONESTOP_CHANNEL_ID")
          fi
          if [ -n "$ONESTOP_INFO_TABS" ]; then
            OPTIONAL_PARAMS+=("OneStopInfoTabs=$ONESTOP_INFO_TABS")
          fi
          sam deploy \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              SlackBotToken="${{ secrets.SLACK_BOT_TOKEN }}" \
              SlackSigningSecret="${{ secrets.SLACK_SIGNING_SECRET }}" \
              SlackChannelIds="${{ vars.SLACK_CHANNEL_IDS }}" \
              GoogleSheetId="${{ vars.GOOGLE_SHEET_ID }}" \
              GenderSheetId="${{ vars.GENDER_SHEET_ID }}" \
              GoogleClientId="${{ secrets.GOOGLE_CLIENT_ID }}" \
              GoogleClientSecret="${{ secrets.GOOGLE_CLIENT_SECRET }}" \
              GoogleRefreshToken="${{ secrets.GOOGLE_REFRESH_TOKEN }}" \
              GroqApiKey="${{ secrets.GROQ_API_KEY }}" \
              "${OPTIONAL_PARAMS[@]}"
