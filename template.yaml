AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: fh-community-bot — Slack Events API receiver + SQS-driven worker

Parameters:
  SlackBotToken:        { Type: String, NoEcho: true }
  SlackSigningSecret:   { Type: String, NoEcho: true }
  SlackChannelIds:      { Type: CommaDelimitedList }
  GoogleSheetId:        { Type: String }
  GenderSheetId:        { Type: String, Default: "" }
  EscalationUserId:     { Type: String, Default: "" }
  AlarmChannel:         { Type: String, Default: "" }
  GoogleClientId:       { Type: String, NoEcho: true }
  GoogleClientSecret:   { Type: String, NoEcho: true }
  GoogleRefreshToken:   { Type: String, NoEcho: true }
  GoogleDriveFolderId:  { Type: String, Default: "" }
  # Anthropic API key and model for the LLM calls. Usage bills to the key's
  # Console account (prepaid credits), not to AWS.
  AnthropicApiKey:      { Type: String, NoEcho: true }
  LlmModelId:           { Type: String, Default: "claude-haiku-4-5" }
  # CREA (landlord) Rent Manager tenant portal. Filing tickets by :ticket:
  # reaction is off unless CreaTicketsEnabled is "true" and a username is set.
  CreaTicketsEnabled:    { Type: String, Default: "false", AllowedValues: ["true", "false"] }
  CreaTwaUsername:       { Type: String, Default: "", NoEcho: true }
  CreaTwaPassword:       { Type: String, Default: "", NoEcho: true }
  CreaTwaPhone:          { Type: String, Default: "" }
  CreaTwaAllowEntry:     { Type: String, Default: "false", AllowedValues: ["true", "false"] }
  CreaTicketUserIds:     { Type: String, Default: "" }
  # #reservations front door. Off unless ReservationsChannelId is set; each
  # backend is off unless its sheet id (or the bundled calendar map) is set.
  ReservationsChannelId: { Type: String, Default: "" }
  RoomRequestsSheetId:   { Type: String, Default: "" }
  KitchenSheetId:        { Type: String, Default: "" }
  RmsBookingEnabled:     { Type: String, Default: "true", AllowedValues: ["true", "false"] }
  # Members connecting their own Google accounts (Web OAuth client in the
  # acts2.network GCP project, Internal consent screen). Off while empty.
  GoogleWebClientId:     { Type: String, Default: "", NoEcho: true }
  GoogleWebClientSecret: { Type: String, Default: "", NoEcho: true }

Globals:
  Function:
    Runtime: nodejs22.x
    Architectures: [arm64]
    LoggingConfig:
      LogFormat: JSON

Resources:
  # FIFO, grouped by Slack user (the receiver sets MessageGroupId): one
  # member's messages are handled one at a time, in order. Content-based
  # dedup drops Slack's own retries of an event within 5 minutes. A FIFO
  # queue's dead letter queue must be FIFO too.
  EventDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub ${AWS::StackName}-events-dlq.fifo
      FifoQueue: true
      MessageRetentionPeriod: 1209600

  EventQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub ${AWS::StackName}-events.fifo
      FifoQueue: true
      ContentBasedDeduplication: true
      VisibilityTimeout: 180
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt EventDLQ.Arn
        maxReceiveCount: 3

  ReceiverFn:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/lambda/receiver.handler
      MemorySize: 128
      Timeout: 10
      Environment:
        Variables:
          SLACK_SIGNING_SECRET: !Ref SlackSigningSecret
          EVENT_QUEUE_URL:      !Ref EventQueue
          # The reservation card's Edit modal and item typeahead are answered
          # here, inside Slack's 3-second limit.
          SLACK_BOT_TOKEN:         !Ref SlackBotToken
          RESERVATIONS_CHANNEL_ID: !Ref ReservationsChannelId
          ROOM_REQUESTS_SHEET_ID:  !Ref RoomRequestsSheetId
          KITCHEN_SHEET_ID:        !Ref KitchenSheetId
      FunctionUrlConfig:
        AuthType: NONE
      Policies:
        - SQSSendMessagePolicy:
            QueueName: !GetAtt EventQueue.QueueName

  ReceiverLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${ReceiverFn}
      RetentionInDays: 14

  WorkerFn:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/lambda/worker.handler
      MemorySize: 256
      # 60s: a :ticket: reaction logs in to the landlord portal, uploads
      # photos and posts the ticket, several slow round-trips in one event.
      Timeout: 60
      Environment:
        Variables:
          SLACK_BOT_TOKEN:        !Ref SlackBotToken
          SLACK_CHANNEL_IDS:      !Join [",", !Ref SlackChannelIds]
          GOOGLE_SHEET_ID:        !Ref GoogleSheetId
          GENDER_SHEET_ID:        !Ref GenderSheetId
          GOOGLE_CLIENT_ID:       !Ref GoogleClientId
          GOOGLE_CLIENT_SECRET:   !Ref GoogleClientSecret
          GOOGLE_REFRESH_TOKEN:   !Ref GoogleRefreshToken
          GOOGLE_DRIVE_FOLDER_ID: !Ref GoogleDriveFolderId
          ANTHROPIC_API_KEY:      !Ref AnthropicApiKey
          LLM_MODEL_ID:           !Ref LlmModelId
          ESCALATION_USER_ID:    !Ref EscalationUserId
          CREA_TICKETS_ENABLED:  !Ref CreaTicketsEnabled
          CREA_TWA_USERNAME:     !Ref CreaTwaUsername
          CREA_TWA_PASSWORD:     !Ref CreaTwaPassword
          CREA_TWA_PHONE:        !Ref CreaTwaPhone
          CREA_TWA_ALLOW_ENTRY:  !Ref CreaTwaAllowEntry
          CREA_TICKET_USER_IDS:  !Ref CreaTicketUserIds
          RESERVATIONS_CHANNEL_ID: !Ref ReservationsChannelId
          ROOM_REQUESTS_SHEET_ID: !Ref RoomRequestsSheetId
          KITCHEN_SHEET_ID:       !Ref KitchenSheetId
          RMS_BOOKING_ENABLED:    !Ref RmsBookingEnabled
          GOOGLE_WEB_CLIENT_ID:     !Ref GoogleWebClientId
          GOOGLE_WEB_CLIENT_SECRET: !Ref GoogleWebClientSecret
          OAUTH_REDIRECT_URI:       !Sub "${OAuthCallbackFnUrl.FunctionUrl}oauth/google/callback"
          AUTH_TABLE:               !Ref AuthTable
          AUTH_KMS_KEY_ID:          !Ref AuthKey
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref AuthTable }
        - KMSDecryptPolicy: { KeyId: !Ref AuthKey }
      Events:
        FromQueue:
          Type: SQS
          Properties:
            Queue: !GetAtt EventQueue.Arn
            BatchSize: 1

  WorkerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${WorkerFn}
      RetentionInDays: 14

  # Monday (weekday digest) and Friday (weekend digest) 8 AM New York time,
  # whatever the DST state: EventBridge Scheduler evaluates the cron in the
  # given zone.
  DigestFn:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/lambda/digest.handler
      Description: Posts the living weekday and weekend reservations digests to #reservations
      MemorySize: 256
      Timeout: 120
      Environment:
        Variables:
          SLACK_BOT_TOKEN:         !Ref SlackBotToken
          SLACK_CHANNEL_IDS:       !Join [",", !Ref SlackChannelIds]
          GOOGLE_SHEET_ID:         !Ref GoogleSheetId
          GOOGLE_CLIENT_ID:        !Ref GoogleClientId
          GOOGLE_CLIENT_SECRET:    !Ref GoogleClientSecret
          GOOGLE_REFRESH_TOKEN:    !Ref GoogleRefreshToken
          ESCALATION_USER_ID:      !Ref EscalationUserId
          RESERVATIONS_CHANNEL_ID: !Ref ReservationsChannelId
          ROOM_REQUESTS_SHEET_ID:  !Ref RoomRequestsSheetId
          KITCHEN_SHEET_ID:        !Ref KitchenSheetId
      Events:
        Weekday:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: cron(0 8 ? * MON *)
            ScheduleExpressionTimezone: America/New_York
            Input: '{"period":"weekday"}'
        Weekend:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: cron(0 8 ? * FRI *)
            ScheduleExpressionTimezone: America/New_York
            Input: '{"period":"weekend"}'

  DigestLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${DigestFn}
      RetentionInDays: 14

  # The digest crashing outright (bad token, Slack down) means no post at all.
  DigestFailedAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: fh-community-digest-failed
      AlarmDescription: The reservations digest Lambda errored and nothing was posted.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref DigestFn
      Statistic: Sum
      Period: 3600
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopic

  # Connected members, pending bookings and sign-in nonces. Refresh tokens are
  # KMS ciphertext; pending rows and nonces expire through TTL.
  AuthTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: fh-community-reservations-auth
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: pk, AttributeType: S }
      KeySchema:
        - { AttributeName: pk, KeyType: HASH }
      TimeToLiveSpecification: { AttributeName: expiresAt, Enabled: true }
      PointInTimeRecoverySpecification: { PointInTimeRecoveryEnabled: true }
      SSESpecification: { SSEEnabled: true }

  AuthKey:
    Type: AWS::KMS::Key
    Properties:
      Description: Encrypts members' Google refresh tokens for #reservations
      EnableKeyRotation: true
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          # Lets IAM policies grant use of the key; the functions below get
          # Encrypt or Decrypt, never both.
          - Sid: AccountRoot
            Effect: Allow
            Principal: { AWS: !Sub "arn:aws:iam::${AWS::AccountId}:root" }
            Action: "kms:*"
            Resource: "*"

  # Google redirects members here after consent. Its own function and URL, so
  # googleapis never weighs on the Slack receiver's 3 s budget.
  OAuthCallbackFn:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/lambda/oauthCallback.handler
      Description: Google sign-in callback for #reservations connected accounts
      MemorySize: 512
      Timeout: 30
      Environment:
        Variables:
          GOOGLE_WEB_CLIENT_ID:     !Ref GoogleWebClientId
          GOOGLE_WEB_CLIENT_SECRET: !Ref GoogleWebClientSecret
          AUTH_TABLE:               !Ref AuthTable
          AUTH_KMS_KEY_ID:          !Ref AuthKey
          EVENT_QUEUE_URL:          !Ref EventQueue
      FunctionUrlConfig:
        AuthType: NONE
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref AuthTable }
        - KMSEncryptPolicy: { KeyId: !Ref AuthKey }
        - SQSSendMessagePolicy: { QueueName: !GetAtt EventQueue.QueueName }

  OAuthCallbackLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${OAuthCallbackFn}
      RetentionInDays: 14

  # ---------------------------------------------------------------------------
  # Observability
  #
  # Alarms publish to SNS; a dedicated Lambda relays them to Slack. The alert
  # path deliberately avoids the bot's own code path, because the alarms worth
  # having are the ones firing because the bot is broken. Subscribe an email
  # address to AlarmTopic for a path that survives a Slack outage.
  # ---------------------------------------------------------------------------
  AlarmTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: fh-community-alarms
      DisplayName: fh-community-bot alarms

  AlarmNotifierFn:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/lambda/alarmNotifier.handler
      Description: Relays CloudWatch alarm state changes into Slack
      Environment:
        Variables:
          SLACK_BOT_TOKEN: !Ref SlackBotToken
          ALARM_CHANNEL:   !Ref AlarmChannel
      Events:
        Alarms:
          Type: SNS
          Properties:
            Topic: !Ref AlarmTopic

  # The most important alarm here. Messages reach the DLQ only after
  # maxReceiveCount 3, so anything landing has already failed three times and
  # will not retry itself — a report is sitting unlogged and nobody knows.
  DLQNotEmptyAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: fh-community-dlq-not-empty
      AlarmDescription: >-
        Messages are in the dead letter queue. Each one is a Slack event that
        failed three times and will not be retried. See docs/RUNBOOK.md for the
        redrive procedure.
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt EventDLQ.QueueName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopic
      OKActions:
        - !Ref AlarmTopic

  # Backlog rather than failure: the worker is keeping up or it is not.
  QueueBacklogAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: fh-community-queue-backlog
      AlarmDescription: >-
        Events have been waiting over five minutes. Someone filed a report and
        is still looking at an unanswered form.
      Namespace: AWS/SQS
      MetricName: ApproximateAgeOfOldestMessage
      Dimensions:
        - Name: QueueName
          Value: !GetAtt EventQueue.QueueName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 300
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopic

  IssueFailedAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: fh-community-issue-write-failed
      AlarmDescription: >-
        An issue report could not be written to the Sheet. The reporter was
        told to try again, so the report is lost unless they do.
      Namespace: FhCommunityBot
      MetricName: IssueFailed
      Dimensions:
        - Name: Flow
          Value: maintenanceForm
      Statistic: Sum
      Period: 900
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopic

  LlmCallFailedAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: fh-community-llm-failed
      AlarmDescription: >-
        A Claude API call failed (model retired, key revoked, credits used
        up, rate limited). Duplicate warnings, form pre-fill and the CREA
        rewrite quietly fall back while this is firing.
      Namespace: FhCommunityBot
      MetricName: LlmCallFailed
      Dimensions:
        - Name: Flow
          Value: llm
      Statistic: Sum
      Period: 900
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopic

  ReceiverLatencyAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: fh-community-receiver-slow
      AlarmDescription: >-
        Receiver p99 is approaching Slack's 3s deadline. Past it Slack retries
        the delivery, which produces duplicate events.
      Namespace: AWS/Lambda
      MetricName: Duration
      Dimensions:
        - Name: FunctionName
          Value: !Ref ReceiverFn
      ExtendedStatistic: p99
      Period: 300
      EvaluationPeriods: 2
      Threshold: 2000
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopic

  Dashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: fh-community-bot
      DashboardBody: !Sub |
        {
          "widgets": [
            {
              "type": "metric", "x": 0, "y": 0, "width": 12, "height": 6,
              "properties": {
                "title": "Issues logged vs failed",
                "region": "${AWS::Region}",
                "stat": "Sum", "period": 86400,
                "metrics": [
                  [ "FhCommunityBot", "IssueLogged", "Flow", "maintenanceForm" ],
                  [ ".", "IssueFailed", ".", "." ]
                ]
              }
            },
            {
              "type": "metric", "x": 12, "y": 0, "width": 12, "height": 6,
              "properties": {
                "title": "Queue depth and DLQ",
                "region": "${AWS::Region}",
                "stat": "Maximum", "period": 300,
                "metrics": [
                  [ "AWS/SQS", "ApproximateNumberOfMessagesVisible", "QueueName", "${EventQueue.QueueName}" ],
                  [ "...", "${EventDLQ.QueueName}" ]
                ]
              }
            },
            {
              "type": "metric", "x": 0, "y": 6, "width": 12, "height": 6,
              "properties": {
                "title": "Receiver latency against Slack's 3s deadline",
                "region": "${AWS::Region}",
                "period": 300,
                "yAxis": { "left": { "min": 0 } },
                "metrics": [
                  [ "AWS/Lambda", "Duration", "FunctionName", "${ReceiverFn}", { "stat": "p50" } ],
                  [ "...", { "stat": "p99" } ]
                ],
                "annotations": { "horizontal": [ { "label": "Slack deadline", "value": 3000 } ] }
              }
            },
            {
              "type": "metric", "x": 12, "y": 6, "width": 12, "height": 6,
              "properties": {
                "title": "Worker throughput and sheet write latency",
                "region": "${AWS::Region}",
                "period": 3600,
                "metrics": [
                  [ "FhCommunityBot", "EventProcessed", "Lambda", "worker", { "stat": "Sum" } ],
                  [ ".", "EventFailed", ".", ".", { "stat": "Sum" } ],
                  [ ".", "SheetWriteMs", "Flow", "maintenanceForm", { "stat": "p99", "yAxis": "right" } ]
                ]
              }
            }
          ]
        }

Outputs:
  OAuthRedirectUri:
    Description: Add this as an authorized redirect URI on the Google Web OAuth client
    Value: !Sub "${OAuthCallbackFnUrl.FunctionUrl}oauth/google/callback"
  FunctionUrl:
    Description: Paste this into the Slack app Event Subscriptions → Request URL
    Value: !GetAtt ReceiverFnUrl.FunctionUrl
  EventQueueUrl:
    Value: !Ref EventQueue
  EventDLQUrl:
    Value: !Ref EventDLQ
  AlarmTopicArn:
    Description: Subscribe an email address here for an alert path independent of Slack
    Value: !Ref AlarmTopic
  DashboardUrl:
    Value: !Sub https://${AWS::Region}.console.aws.amazon.com/cloudwatch/home?region=${AWS::Region}#dashboards:name=fh-community-bot
