AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: fh-community-bot — Slack Events API receiver + SQS-driven worker

Parameters:
  SlackBotToken:        { Type: String, NoEcho: true }
  SlackSigningSecret:   { Type: String, NoEcho: true }
  SlackChannelIds:      { Type: CommaDelimitedList }
  GoogleSheetId:        { Type: String }
  GenderSheetId:        { Type: String, Default: "" }
  GoogleClientId:       { Type: String, NoEcho: true }
  GoogleClientSecret:   { Type: String, NoEcho: true }
  GoogleRefreshToken:   { Type: String, NoEcho: true }
  GroqApiKey:           { Type: String, NoEcho: true }

Globals:
  Function:
    Runtime: nodejs22.x
    Architectures: [arm64]
    LoggingConfig:
      LogFormat: JSON

Resources:
  EventDLQ:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600

  EventQueue:
    Type: AWS::SQS::Queue
    Properties:
      VisibilityTimeout: 180
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt EventDLQ.Arn
        maxReceiveCount: 3

  # Holds maintenance issues awaiting a severity reply, keyed by channel+thread.
  # Records auto-expire via the `ttl` attribute so abandoned prompts clear out.
  PendingTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  ReceiverFn:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/lambda/receiver.handler
      MemorySize: 128
      Timeout: 10
      Environment:
        Variables:
          SLACK_SIGNING_SECRET: !Ref SlackSigningSecret
          EVENT_QUEUE_URL:      !Ref EventQueue
      FunctionUrlConfig:
        AuthType: NONE
      Policies:
        - SQSSendMessagePolicy:
            QueueName: !GetAtt EventQueue.QueueName

  ReceiverLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${ReceiverFn}
      RetentionInDays: 14

  WorkerFn:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/lambda/worker.handler
      MemorySize: 256
      Timeout: 30
      Environment:
        Variables:
          SLACK_BOT_TOKEN:        !Ref SlackBotToken
          SLACK_CHANNEL_IDS:      !Join [",", !Ref SlackChannelIds]
          GOOGLE_SHEET_ID:        !Ref GoogleSheetId
          GENDER_SHEET_ID:        !Ref GenderSheetId
          GOOGLE_CLIENT_ID:       !Ref GoogleClientId
          GOOGLE_CLIENT_SECRET:   !Ref GoogleClientSecret
          GOOGLE_REFRESH_TOKEN:   !Ref GoogleRefreshToken
          GROQ_API_KEY:           !Ref GroqApiKey
          PENDING_TABLE_NAME:     !Ref PendingTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref PendingTable
      Events:
        FromQueue:
          Type: SQS
          Properties:
            Queue: !GetAtt EventQueue.Arn
            BatchSize: 1

  WorkerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${WorkerFn}
      RetentionInDays: 14

Outputs:
  FunctionUrl:
    Description: Paste this into the Slack app Event Subscriptions → Request URL
    Value: !GetAtt ReceiverFnUrl.FunctionUrl
  EventQueueUrl:
    Value: !Ref EventQueue
  EventDLQUrl:
    Value: !Ref EventDLQ
