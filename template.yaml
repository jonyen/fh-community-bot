AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: fh-community-bot — Slack Events API receiver + SQS-driven worker

Parameters:
  SlackBotToken:        { Type: String, NoEcho: true }
  SlackSigningSecret:   { Type: String, NoEcho: true }
  SlackChannelIds:      { Type: CommaDelimitedList }
  GoogleSheetId:        { Type: String }
  GenderSheetId:        { Type: String, Default: "" }
  GoogleClientId:       { Type: String, NoEcho: true }
  GoogleClientSecret:   { Type: String, NoEcho: true }
  GoogleRefreshToken:   { Type: String, NoEcho: true }
  GroqApiKey:           { Type: String, NoEcho: true }
  SlackBotUserId:       { Type: String, Default: "" }
  BballChannels:        { Type: String, Default: "" }
  ScheduleExpression:   { Type: String, Default: "cron(0 8 ? * TUE,THU *)" }
  GitSha:               { Type: String, Default: "unknown" }
  GithubRunNumber:      { Type: String, Default: "unknown" }

Globals:
  Function:
    Runtime: nodejs22.x
    Architectures: [arm64]
    LoggingConfig:
      LogFormat: JSON

Resources:
  EventDLQ:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600

  EventQueue:
    Type: AWS::SQS::Queue
    Properties:
      VisibilityTimeout: 180
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt EventDLQ.Arn
        maxReceiveCount: 3

  ReceiverFn:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/lambda/receiver.handler
      MemorySize: 128
      Timeout: 10
      Environment:
        Variables:
          SLACK_SIGNING_SECRET: !Ref SlackSigningSecret
          EVENT_QUEUE_URL:      !Ref EventQueue
      FunctionUrlConfig:
        AuthType: NONE
      Policies:
        - SQSSendMessagePolicy:
            QueueName: !GetAtt EventQueue.QueueName

  ReceiverLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${ReceiverFn}
      RetentionInDays: 14

  WorkerFn:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/lambda/worker.handler
      MemorySize: 256
      Timeout: 30
      Environment:
        Variables:
          SLACK_BOT_TOKEN:        !Ref SlackBotToken
          SLACK_CHANNEL_IDS:      !Join [",", !Ref SlackChannelIds]
          GOOGLE_SHEET_ID:        !Ref GoogleSheetId
          GENDER_SHEET_ID:        !Ref GenderSheetId
          GOOGLE_CLIENT_ID:       !Ref GoogleClientId
          GOOGLE_CLIENT_SECRET:   !Ref GoogleClientSecret
          GOOGLE_REFRESH_TOKEN:   !Ref GoogleRefreshToken
          GROQ_API_KEY:           !Ref GroqApiKey
          SLACK_BOT_USER_ID:      !Ref SlackBotUserId
          BBALL_CHANNEL_IDS:      !Ref BballChannels
          GIT_SHA:                !Ref GitSha
          GITHUB_RUN_NUMBER:      !Ref GithubRunNumber
      Events:
        FromQueue:
          Type: SQS
          Properties:
            Queue: !GetAtt EventQueue.Arn
            BatchSize: 1

  WorkerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${WorkerFn}
      RetentionInDays: 14

  PostMessageFn:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/lambda/postMessage.handler
      MemorySize: 256
      Timeout: 30
      Environment:
        Variables:
          SLACK_BOT_TOKEN:   !Ref SlackBotToken
          SLACK_BOT_USER_ID: !Ref SlackBotUserId
          BBALL_CHANNEL_IDS: !Ref BballChannels

  PostMessageLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${PostMessageFn}
      RetentionInDays: 14

  PostScheduleRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: scheduler.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: InvokePostMessage
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt PostMessageFn.Arn

  PostSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: fh-bball-post-schedule
      Description: Tue/Thu 8am ET basketball roll-call (DST-aware)
      ScheduleExpression: !Ref ScheduleExpression
      ScheduleExpressionTimezone: America/New_York
      FlexibleTimeWindow:
        Mode: "OFF"
      State: ENABLED
      Target:
        Arn: !GetAtt PostMessageFn.Arn
        RoleArn: !GetAtt PostScheduleRole.Arn

Outputs:
  FunctionUrl:
    Description: Paste this into the Slack app Event Subscriptions → Request URL
    Value: !GetAtt ReceiverFnUrl.FunctionUrl
  EventQueueUrl:
    Value: !Ref EventQueue
  EventDLQUrl:
    Value: !Ref EventDLQ
